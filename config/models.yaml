# Nebius Endpoint Lab — Model Catalogue
#
# Available platforms and their presets (from nebius compute platform list):
#   gpu-h200-sxm  141 GB VRAM  → presets: 1gpu-16vcpu-200gb  /  8gpu-128vcpu-1600gb
#   gpu-b200-sxm  180 GB VRAM  → presets: 1gpu-20vcpu-224gb  /  8gpu-160vcpu-1792gb
#   gpu-rtx6000    96 GB VRAM  → presets: 1gpu-24vcpu-218gb  /  8gpu-192vcpu-1744gb
#
# gpu_count drives preset selection at creation time:
#   gpu_count: 1  → the 1-GPU preset for whichever platform is chosen
#   gpu_count: 8  → the 8-GPU preset for whichever platform is chosen
#
# gated: true  →  HUGGING_FACE_HUB_TOKEN required in .env or UI

